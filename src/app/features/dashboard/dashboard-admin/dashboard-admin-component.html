<div class="card shadow">
  <div class="card-header bg-primary text-white">Employee Dashboard Admin</div>
  <div class="card-body">
    <div class="mb-3">
      <input
        type="text"
        class="form-control"
        placeholder="Search employees..."
        [formControl]="searchControl"
      />
    </div>

    <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="empName" class="form-label">Employee Name</label>
        <input id="empName" type="text" class="form-control" formControlName="empName" />
        <div *ngIf="employeeForm.get('empName')?.invalid && employeeForm.get('empName')?.touched" class="text-danger">
          Employee name is required.
        </div>
      </div>

      <div class="mb-3">
        <label for="deptId" class="form-label">Department ID</label>
        <input id="deptId" type="number" class="form-control" formControlName="deptId" />
        <div *ngIf="employeeForm.get('deptId')?.invalid && employeeForm.get('deptId')?.touched" class="text-danger">
          Department ID is required.
        </div>
      </div>

      <div class="mb-3">
        <label for="locId" class="form-label">Location ID</label>
        <input id="locId" type="number" class="form-control" formControlName="locId" />
        <div *ngIf="employeeForm.get('locId')?.invalid && employeeForm.get('locId')?.touched" class="text-danger">
          Location ID is required.
        </div>
      </div>

      <button type="submit" class="btn btn-success" [disabled]="employeeForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Submitting...' : 'Submit' }}
      </button>
    </form>

    <table class="table table-striped table-bordered mt-4" *ngIf="employees.length > 0">
      <thead class="table-dark">
        <tr>
          <th>Employee Name</th>
          <th>Department ID</th>
          <th>Location ID</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let emp of filteredEmployees()">
          <td>{{ emp.empName }}</td>
          <td>{{ emp.deptId }}</td>
          <td>{{ emp.locId }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
