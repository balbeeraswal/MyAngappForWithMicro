name: Angular CI/CD Pipeline

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  ANGULAR_PACKAGE_PATH: dist/myAngularAppForTes/browser

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Angular tests (Vitest)
        run: npm test -- --no-watch

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular (production)
        run: npm run build -- --configuration production

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-artifact
          path: ${{ env.ANGULAR_PACKAGE_PATH }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-artifact
          path: ./angular

      - name: Deploy to Staging Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING }}
          action: upload
          app_location: ./angular
          skip_app_build: true
          skip_api_build: true

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
    steps:
      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-artifact
          path: ./angular

      - name: Deploy to Production Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: ./angular
          skip_app_build: true
          skip_api_build: true
