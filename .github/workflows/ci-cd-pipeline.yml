name: Angular CI/CD Pipeline

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME_STAGING: WebAppNameAngularStaging
  AZURE_WEBAPP_NAME_PRODUCTION: WebAppNameAngular
  NODE_VERSION: '20.x'
  ANGULAR_PACKAGE_PATH: dist/myAngularAppForTes/browser
  HEALTHCHECK_PATH: /ping   # Health check endpoint

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Angular tests (Vitest)
        run: npm test -- --no-watch

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular (production)
        run: npm run build -- --configuration production

      - name: Add routes.json for SPA fallback
        run: |
          echo '{
            "routes": [
              {
                "route": "/*",
                "serve": "/index.html",
                "statusCode": 200
              }
            ]
          }' > ${{ env.ANGULAR_PACKAGE_PATH }}/routes.json

      - name: Add health check file
        run: |
          echo '<!DOCTYPE html><html><body>OK</body></html>' > ${{ env.ANGULAR_PACKAGE_PATH }}/ping.html

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-artifact
          path: ${{ env.ANGULAR_PACKAGE_PATH }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-artifact
          path: ./angular

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Angular to Staging
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_STAGING }}
          package: ./angular

  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging, build]
    environment:
      name: production
    steps:
      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-artifact
          path: ./angular

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Angular to Production
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_PRODUCTION }}
          package: ./angular
