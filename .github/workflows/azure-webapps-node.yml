
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME_STAGING: WebAppNameAngular_STAGING
  AZURE_WEBAPP_NAME_PRODUCTION: WebAppNameAngular    # set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '24.x'                # set this to the node version to use

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: npm install, build, and test
      run: |
        npm install
        npm run build --if-present
        npm run test --if-present

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: .



  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      - run: npm run test -- --watch=false --browsers=ChromeHeadless
      - run: dotnet test --configuration Release

      

  deploy-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy Angular to Test
        uses: azure/webapps-deploy@v2
        with:
          app-name: AZURE_WEBAPP_NAME_STAGING
          package: dist/myAngularAppForTes
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy API to Test
        uses: azure/webapps-deploy@v2
        with:
          app-name: AZURE_WEBAPP_NAME_STAGING
          package: ./output
          creds: ${{ secrets.AZURE_CREDENTIALS }}



  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-test
    if: github.event.inputs.approve == 'true'
    steps:
      - name: Deploy Angular to Prod
        uses: azure/webapps-deploy@v2
        with:
          app-name: AZURE_WEBAPP_NAME_PRODUCTION
          package: dist/myAngularAppForTes
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy API to Prod
        uses: azure/webapps-deploy@v2
        with:
          app-name: AZURE_WEBAPP_NAME_PRODUCTION
          package: ./output
          creds: ${{ secrets.AZURE_CREDENTIALS }}
